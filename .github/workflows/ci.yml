name: ci

on:
  pull_request:
  push:
    branches: [main]

# semgrep is intentionally omitted: this is a pure static-asset repo with no
# source code to scan.

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-banner --verbose

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static assets
        run: |
          set -euo pipefail

          # Expected assets must exist.
          test -f vitalic-stacked-colored.svg

          # No oversized binaries: fail on any tracked file larger than 2 MB.
          big=$(find . -type f -not -path './.git/*' -size +2M)
          if [ -n "$big" ]; then
            echo "Oversized files found:"
            echo "$big"
            exit 1
          fi

          # Every SVG must be well-formed XML.
          shopt -s nullglob globstar
          for svg in **/*.svg; do
            echo "Checking $svg"
            python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$svg"
          done

          echo "All asset checks passed."
